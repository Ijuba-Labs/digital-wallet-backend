name: wallet-backend
services:
  wallet-api:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    env_file: ../../.env
    ports:
      - "9001:${PORT:-9000}"
    networks: [wallet-backend]
    depends_on:
      # db-migrate:
      #   condition: service_completed_successfully
      shared-redis:
        condition: service_healthy
  payment-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    env_file: ../../.env
    command: pnpm worker:dev
    networks: [wallet-backend]

  shared-database:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [wallet-backend]
    volumes: [
      "pgdata:/var/lib/postgresql/data",
      "../../src/database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql"
      ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
  shared-redis:
    image: redis:8
    restart: unless-stopped
    networks: [wallet-backend]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --save 60 1 --loglevel notice --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: [redis-data:/data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  wallet-backend:
    driver: bridge
volumes:
  redis-data:
  pgdata:
