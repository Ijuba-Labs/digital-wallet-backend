name: Publish payment primitives
on:
  push:
    tags: [payment-primitives-v*]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-payment-primitives
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/open-payments-primitives
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@ijuba-labs'
          cache: pnpm
          cache-dependency-path: packages/open-payments-primitives/pnpm-lock.yaml
      - name: Validate release tag and owner
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REPOSITORY !== "Ijuba-Labs/digital-wallet-backend" ||
                pkg.name !== "@ijuba-labs/payment-primitives" ||
                process.env.GITHUB_REF_NAME !== `payment-primitives-v${pkg.version}`) {
              throw new Error("Release tag, package version, or repository owner mismatch");
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify publication contents
        run: node ../../scripts/verify-payment-package.mjs
      - name: Publish built package
        run: npm publish --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
