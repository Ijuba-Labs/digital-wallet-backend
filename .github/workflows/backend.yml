name: Backend
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/open-payments-primitives/pnpm-lock.yaml

      # file: dependencies are installed from the package's current contents.
      # Generate its exported JavaScript/declarations before installing the backend.
      - name: Install payment primitives dependencies
        run: pnpm --dir packages/open-payments-primitives install --frozen-lockfile

      - name: Build payment primitives
        run: pnpm --dir packages/open-payments-primitives build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck backend
        run: pnpm run build

      - name: Run Tests
        run: pnpm test

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info
